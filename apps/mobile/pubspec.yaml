name: ohana_mobile
description: "Ohana — Plataforma de alquileres y arrendamientos en Colombia"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # HTTP & networking
  dio: ^5.7.0

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Storage
  flutter_secure_storage: ^9.2.3
  shared_preferences: ^2.3.3

  # Real-time (chat)
  socket_io_client: ^2.0.3+1

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  fl_chart: ^0.69.2

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  timeago: ^3.7.0
  form_builder_validators: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^3.2.5
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
