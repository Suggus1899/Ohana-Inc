services:
  postgres:
    image: postgres:16-alpine
    container_name: ohana-postgres-${BRANCH_NAME:-dev}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ohana_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ohana_password_2026}
      POSTGRES_DB: ${DB_NAME:-ohana_db}
    volumes:
      # Usamos bind mount en lugar de volumen nombrado para tener control del nombre
      - ./pgdata_${BRANCH_NAME:-dev}:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-ohana_user} -d ${DB_NAME:-ohana_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${DB_PORT:-5433}:5432"
    networks:
      - ohana-network

  redis:
    image: redis:7-alpine
    container_name: ohana-redis-${BRANCH_NAME:-dev}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6381}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ohana-network

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/docker/Dockerfile.dev
    container_name: ohana-backend-${BRANCH_NAME:-dev}
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3026}:5000"
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
      OSRM_API_URL: http://osrm:5000
      NOMINATIM_API_URL: http://osrm:8080
      GEOCODE_PORT: ${GEOCODE_PORT:-8081}
      DEFAULT_SEARCH_RADIUS_KM: ${DEFAULT_SEARCH_RADIUS_KM:-10}
      LOCAL_GEOCODING_URL: http://geocoding:8081
    env_file:
      - .env 

    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
      - ./storage_${BRANCH_NAME:-dev}:/app/storage
      - ./logs_${BRANCH_NAME:-dev}:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      osrm:
        condition: service_started
      geocoding:
        condition: service_started
    networks:
      - ohana-network

  osrm:
    build:
      context: ../..
      dockerfile: apps/backend/docker/Dockerfile.combined
    container_name: ohana-osrm-${BRANCH_NAME:-dev}
    restart: unless-stopped
    ports:
      - "${OSRM_PORT:-5001}:5000"
      - "${GEOCODE_PORT:-8082}:8080"
    volumes:
      - ./data:/data
    networks:
      - ohana-network

  geocoding:
    build:
      context: ../..
      dockerfile: apps/backend/docker/Dockerfile.geocoding
    container_name: ohana-geocoding-${BRANCH_NAME:-dev}
    restart: unless-stopped
    ports:
      - "${LOCAL_GEOCODE_PORT:-8081}:8081"
    environment:
      GEOCODE_PORT: ${LOCAL_GEOCODE_PORT:-8081}
      HOST: 0.0.0.0
    volumes:
      - ./geocoding/server-enhanced.js:/app/geocode-server-enhanced.js
    networks:
      - ohana-network

networks:
  ohana-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local