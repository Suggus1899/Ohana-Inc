name: Cleanup Dev Environment

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Eliminar entorno de la rama cerrada
        run: |
          BRANCH_NAME=$(echo "${{ github.head_ref }}" | sed 's/\//-/g')
          ssh root@31.97.171.120 "cd /root/apps/$BRANCH_NAME/apps/backend && \
            docker-compose -p residencias-$BRANCH_NAME down -v || true && \
            cd ../../ && rm -rf $BRANCH_NAME"